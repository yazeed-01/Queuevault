name: queuevault
description: "QueueVault — track movies, series, anime, games, and products you want to experience."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  dio: ^5.8.0+1
  json_annotation: ^4.9.0

  # Routing
  go_router: ^15.1.2

  # Models
  freezed_annotation: ^2.4.4

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Share intent
  receive_sharing_intent: ^1.8.0
  share_plus: ^10.1.4

  # Auth & Drive (Google - SHA-1 to be added later)
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Permissions
  permission_handler: ^12.0.0+1
  connectivity_plus: ^6.1.4

  # UI extras
  flutter_svg: ^2.0.17
  flutter_staggered_grid_view: ^0.7.0
  confetti: ^0.8.0
  url_launcher: ^6.3.1

  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.2.1
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  drift_dev: ^2.22.1
  json_serializable: ^6.9.5
  freezed: ^2.5.8

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
    - .env
